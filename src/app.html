<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300..700&family=Syne:wght@400..800&display=swap"
    />
    <script nonce="%sveltekit.nonce%">
      (function () {
        try {
          var root = document.documentElement;
          var ls = window.localStorage;
          var stored = ls.getItem("snips.theme");
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          var flags = {
            "snips.a11y.reduced-motion": "a11y-reduce-motion",
            "snips.a11y.larger-text": "a11y-large-text",
            "snips.a11y.stronger-focus": "a11y-strong-focus",
            "snips.pref.compact-layout": "pref-compact",
          };
          for (var k in flags) if (ls.getItem(k) === "1") root.classList.add(flags[k]);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body class="antialiased" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
